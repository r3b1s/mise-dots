## Other

### Scaffold Dirs
[tasks.scaffold-dirs]
description = "Scaffold common directories"
run = """
#!/usr/bin/env bash
mkdir -p \
  ~/tmp \
  ~/Dotfiles \
  ~/Engagements \
  ~/Projects \
  ~/Shared \
  ~/Machines \
  ~/3rdParty
"""

