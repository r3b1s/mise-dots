# -------- SETTINGS --------- #
[settings]
# minimum_release_age = "3d"
minimum_release_age_excludes = ["pi", "oh-my-pi", "npm:command-code"]
locked_scopes = ["project"]

[settings.upgrade]
auto_prune = false


# ----------- ENV ----------- #
[env]

## Editor
EDITOR='nvim'

## Directories & Repositories
DOTS_DIR="/home/$USER/Dotfiles"

## Directories & Repositories
DOTS_MISE_DIR="${DOTS_DIR}/mise-dots"
DOTS_MISE_HTTPS='https://github.com/r3b1s/mise-dots'
DOTS_MISE_SSH='git@github.com:r3b1s/mise-dots.git'

DOTS_HARNESS_DIR="${DOTS_DIR}/harness-dots"
DOTS_HARNESS_HTTPS='https://github.com/r3b1s/harness-dots'
DOTS_HARNESS_SSH='git@github.com:r3b1s/harness-dots.git'

DOTS_OMARCHY_DIR="${DOTS_DIR}/quattro-dots"
DOTS_OMARCHY_HTTPS='https://github.com/r3b1s/quattro-dots'
DOTS_OMARCHY_SSH='git@github.com:r3b1s/quattro-dots.git'

DOTS_ARCH_DIR="${DOTS_DIR}/cachy-dots"
DOTS_ARCH_HTTPS='https://github.com/r3b1s/cachy-dots'
DOTS_ARCH_SSH='git@github.com:r3b1s/cachy-dots.git'

DOTS_QUBES_DIR="${DOTS_DIR}/qubes-dots"
DOTS_QUBES_HTTPS='https://github.com/r3b1s/qubes-dots'
DOTS_QUBES_SSH='git@github.com:r3b1s/qubes-dots.git'

DOTS_KANATA_DIR="${DOTS_DIR}/kanata-enthium"
DOTS_KANATA_HTTPS='https://github.com/r3b1s/kanata-enthium'
DOTS_KANATA_SSH='git@github.com:r3b1s/kanata-enthium.git'

## Pi default global cfg | Safety catch-all. Pi-derivative harnesses like oh-my-pi will clobber Pi's cfg files & sessions
PI_CODING_AGENT_DIR="/home/$USER/.pi/agent"



# ---------- TOOLS ---------- #
[tools]
node = "latest"
uv = "latest"
age = "1.3.2"

## ai slop
pi = "latest"
"npm:command-code" = "latest"
"npm:donsetch" = "latest"
agent-browser = "latest"
# codex = "latest"
gh = "latest"
oh-my-pi = { version = "latest", rename_exe = "omp" }
herdr = "latest"
antigravity-cli = "latest"



# ---------- TASKS ---------- #
# Tasks are executable scripts under tasks/. The path below tasks/ becomes the
# task name: tasks/dots/omarchy/setup.sh -> `mise run dots:omarchy:setup`.
# Task metadata lives in #MISE header comments in each script.
[task_config]
includes = ["~/Dotfiles/mise-dots/tasks"]
